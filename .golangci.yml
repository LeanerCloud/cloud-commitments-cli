version: "2"
run:
  build-tags:
    - integration
  tests: true
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gocyclo
    - godot
    - gosec
    - misspell
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
      enabled-tags:
        - diagnostic
        - performance
        - style
      settings:
        # aws.Config and similar SDK/config structs are designed to be passed
        # by value (the AWS SDK v2 copies Config intentionally). 1024 bytes covers
        # these idiomatic large-but-value-typed params without suppressing
        # genuinely oversized plain domain structs.
        hugeParam:
          sizeThreshold: 1024
    gocyclo:
      min-complexity: 10
    # gosec here is a code-hygiene signal, narrower than the enforcing gate
    # scripts/run-gosec.sh (CI, pre-commit, Make; all rules, all severities,
    # no config file, #nosec honored). Here G104 is excluded, severity and
    # confidence are medium+, and the legacy/common-false-positives presets
    # drop G301/G302/G304; gosec is also skipped in _test.go (the standalone
    # scan omits tests by default). A clean golangci run does not imply a
    # clean gosec run.
    gosec:
      excludes:
        - G104
      severity: medium
      confidence: medium
      config:
        G101:
          ignore_entropy: false
          pattern: (?i)passwd|pass|password|pwd|secret|token
    govet:
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: var-naming
          disabled: false
        - name: package-comments
          disabled: true
        - name: exported
          disabled: false
        - name: indent-error-flow
          disabled: false
        - name: error-return
          disabled: false
        - name: error-naming
          disabled: false
        - name: error-strings
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gocyclo
          - gosec
        path: _test\.go
      # unusedwrite: test fixture struct fields may be set for documentation
      # completeness even when only a subset of fields is read by a given subtest.
      # Scoped to test files so production unusedwrite bugs remain visible.
      - linters:
          - govet
        text: "unusedwrite"
        path: _test\.go
      # fieldalignment: test-table memory layout is irrelevant, and reordering
      # positional table literals risks silent misassignment. Production code
      # stays checked.
      - linters:
          - govet
        text: "fieldalignment:"
        path: _test\.go
      - linters:
          - all
        path: .*_gen\.go
      # noctx: exec.Command calls in configure CLI helpers intentionally
      # omit context (CommandRunner interface contract; operator-controlled inputs).
      # Suppressed per-file rather than per-line so #nosec G204 can lead the comment.
      - linters:
          - noctx
        path: (cmd/configure_gcp|cmd/configure_azure)\.go
      # noctx: http.Get and net.Listen in test helpers appropriately use the
      # background context; threading a test context through every helper would
      # add noise without improving test correctness.
      - linters:
          - noctx
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
severity:
  default: warning
  rules:
    - linters:
        - gosec
      severity: error
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
